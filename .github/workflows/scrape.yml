name: Actualizar catálogo

on:
  schedule:
    # 06:00 Argentina (UTC-3) todos los días
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_images:
        description: "Volver a bajar todas las imágenes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Scrapear datos e imágenes
        env:
          # Configurables en Settings → Secrets and variables → Actions → Variables
          MARKUP: ${{ vars.MARKUP || '0.2' }}
          WEB_SURCHARGE: ${{ vars.WEB_SURCHARGE || '0.15' }}
          CASH_DISCOUNT: ${{ vars.CASH_DISCOUNT || '0.1' }}
        run: |
          node scripts/scrape.mjs
          node scripts/download-images.mjs --concurrency=4 ${{ inputs.force_images && '--force' || '' }}

      - name: Verificar que el build pasa con los datos nuevos
        run: npm run build

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json public/img
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./data/products.json').count)")
          git commit -m "chore(catalogo): actualización automática ($COUNT productos)"
          git push
